<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="menu"></div>
<script src="menu.js"></script>
<main>
    <h1>Задание 4. Массивы школьных предметов</h1>
    <p>Исходный массив содержит названия предметов. Метод <code>slice()</code> выделяет из него два массива: точные и гуманитарные науки.</p>
    <div id="subjects"></div>
    <script>
        function showSubjects() {
            var subjects = ["Алгебра", "Геометрия", "Информатика", "Физика", "Русский язык", "Литература", "История", "Обществознание"];
            var exact = subjects.slice(0, 4);
            var humanities = subjects.slice(4, 8);
            document.write("<h2>Точные науки</h2><p>" + exact.join(", ") + "</p>");
            document.write("<h2>Гуманитарные науки</h2><p>" + humanities.join(", ") + "</p>");
        }
        showSubjects();
    </script>
</main>
</body>
</html>
