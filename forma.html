<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Переключатели, флажки и списки</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="menu"></div>
<script src="menu.js"></script>

<main>
    <form>
        <h2>Группа переключателей</h2>

        <p>Фамилия:</p>

        <input type="text" value="Иванов" id="surname">
        <input type="button" value="Вывести фамилию" onclick="showSurname();">

        <br><br>

        <input type="radio" name="color">
        Белый

        <br>

        <input type="radio" name="color">
        Красный

        <br>

        <input type="radio" name="color">
        Желтый

        <br>

        <input type="radio" name="color">
        Зеленый

        <h2>Группа флажков</h2>

        <input type="checkbox" name="hobby" id="hobby1">
        Ходить на БДсМ

        <br>

        <input type="checkbox" name="hobby" id="hobby2">
        Кататься в бункере

        <br>

        <input type="checkbox" name="hobby" id="hobby3">
        Ездить к любимой

        <br><br>

        <input type="button"
               value="Пишите мне"
               onclick="window.open('https://vk.ru/id517425695');">

        <br><br>

        <input type="button"
               value="Посмотрите мои фотографии"
               onclick="window.open('https://vk.ru/slobkollru');">

        <h2>Раскрывающийся и обычный список</h2>

        <table>
            <caption>Выберите страну:</caption>
            <tr>
                <td>
                    <select name="COUNTRY">
                        <option>Беларусь</option>
                        <option>Казахстан</option>
                        <option>Россия</option>
                        <option>Украина</option>
                    </select>
                </td>

                <td>
                    <select name="COUNTRIES" size="3" multiple>
                        <option>Беларусь</option>
                        <option>Казахстан</option>
                        <option selected>Россия</option>
                        <option>Украина</option>
                    </select>
                </td>
            </tr>
        </table>

        <hr>

        <h2>Анкета</h2>

        <p>Имя:</p>
        <input type="text" id="name">

        <p>Возраст:</p>
        <input type="text" id="age">

        <p>Город:</p>
        <input type="text" id="city">

        <p>Увлечения:</p>
        <p>Выберите увлечения выше.</p>

        <input type="button" value="Показать анкету" onclick="showForm();">

        <h2>Результат</h2>
        <div id="result"></div>
    </form>
</main>

<script>
    function showSurname() {
        var surname = document.getElementById("surname").value;
        alert("Ваша фамилия: " + surname);
    }

    function showForm() {
        var name = document.getElementById("name").value;
        var age = document.getElementById("age").value;
        var city = document.getElementById("city").value;

        var hobbies = "";

        if (document.getElementById("hobby1").checked) {
            hobbies += "Ходить на БДсМ<br>";
        }

        if (document.getElementById("hobby2").checked) {
            hobbies += "Кататься в бункере<br>";
        }

        if (document.getElementById("hobby3").checked) {
            hobbies += "Ездить к любимой<br>";
        }

        document.getElementById("result").innerHTML =
            "Имя: " + name + "<br>" +
            "Возраст: " + age + "<br>" +
            "Город: " + city + "<br>" +
            "Увлечения:<br>" + hobbies;
    }
</script>

</body>
</html>
