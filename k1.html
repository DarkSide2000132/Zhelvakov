<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Выбор картинки — k1.html</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .bas {
            position: relative;
            width: 1000px;
            margin: auto;
        }
        .im {
            width: 300px;
            border: 1px solid #000000;
            margin: 10px;
        }
    </style>
</head>
<body>
<div id="menu"></div>
<script src="menu.js"></script>

<main>
    <h1>Выбор картинки (наведение мыши)</h1>
    <p>Наведите указатель мыши на любой автомобиль — остальные плавно «растворятся».</p>

    <div class="bas">
        <img src="cars/car1.jpg" id="i1" class="im" alt="Автомобиль 1">
        <img src="cars/car2.jpg" id="i2" class="im" alt="Автомобиль 2">
        <img src="cars/car3.jpg" id="i3" class="im" alt="Автомобиль 3">
        <img src="cars/car4.jpg" id="i4" class="im" alt="Автомобиль 4">
        <img src="cars/car5.jpg" id="i5" class="im" alt="Автомобиль 5">
        <img src="cars/car6.jpg" id="i6" class="im" alt="Автомобиль 6">
    </div>
</main>

<script>
    addEventListener("mouseover", (ev) => {
        let e = ev.target;
        if (e.tagName == "IMG") {
            for (let i = 1; i < 7; i++) {
                let b = "i" + i;
                if (e.id != b) {
                    let t = document.getElementById(b).style;
                    t.transition = "opacity 1s";
                    t.opacity = 0.1;
                }
            }
        } else {
            for (let i = 1; i < 7; i++) {
                let b = "i" + i;
                let t = document.getElementById(b).style;
                t.transition = "opacity 2s";
                t.opacity = 1;
            }
        }
    });
</script>
</body>
</html>
