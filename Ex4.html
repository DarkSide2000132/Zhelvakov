<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ex4 — условия и пароль — Иван Новосёлов</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="menu"></div>
<script src="menu.js"></script>
<main>
    <h1>Задание 1. Условные операторы</h1>
    <h2>Сравнение двух чисел</h2>
    <p>Нажмите кнопку и введите два числа. Страница сообщит, какое число больше, либо что числа равны.</p>
    <button type="button" onclick="compareNumbers()">Сравнить числа</button>
    <h2>Проверка пароля</h2>
    <p>Нажмите кнопку и введите пароль. Правильный пароль в учебном примере: <strong>12345</strong>.</p>
    <button type="button" onclick="checkPassword()">Проверить пароль</button>
    <p id="result" aria-live="polite"></p>
    <script>
        function compareNumbers() {
            var x = parseInt(prompt("Введите значение x:", ""), 10);
            if (x === null || Number.isNaN(x)) { alert("Первое значение не является числом."); return; }
            var y = parseInt(prompt("Введите значение y:", ""), 10);
            if (y === null || Number.isNaN(y)) { alert("Второе значение не является числом."); return; }
            if (x < y) alert("Максимальное число — " + y);
            else if (x > y) alert("Максимальное число — " + x);
            else alert("Введенные числа равны!");
        }
        function checkPassword() {
            var password = "12345";
            var enteredPassword = prompt("Введите правильный пароль:", "");
            var result = document.getElementById("result");
            if (enteredPassword === password) {
                result.textContent = "Пароль верен!";
                alert("Пароль верен!");
            } else {
                result.textContent = "Пароль введён неправильно.";
                alert("Неправильно введён пароль!");
            }
        }
    </script>
</main>
</body>
</html>
