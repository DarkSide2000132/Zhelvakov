<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Светофоры</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Стили только для светофоров */
        .svetofory {
            display: flex;
            gap: 60px;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        .svetofor-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .svetofor-box h3 {
            margin: 0;
            font-size: 18px;
        }

        .traffic-light {
            width: 110px;
            background: #222;
            border-radius: 18px;
            padding: 16px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.35);
        }

        .light {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            background: #333;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.7);
            transition: all 0.3s ease;
        }

        .light.red    { background: #3a0000; }
        .light.yellow { background: #3a2a00; }
        .light.green  { background: #002a00; }

        .light.red.on {
            background: #ff1a1a;
            box-shadow: 0 0 22px #ff1a1a, 0 0 40px #ff1a1a55;
        }

        .light.yellow.on {
            background: #ffcc00;
            box-shadow: 0 0 22px #ffcc00, 0 0 40px #ffcc0055;
        }

        .light.green.on {
            background: #00e676;
            box-shadow: 0 0 22px #00e676, 0 0 40px #00e67655;
        }

        .light.green.blink {
            animation: blink 0.6s infinite;
        }

        @keyframes blink {
            0%, 100% {
                background: #00e676;
                box-shadow: 0 0 22px #00e676, 0 0 40px #00e67655;
            }
            50% {
                background: #002a00;
                box-shadow: inset 0 0 10px rgba(0,0,0,0.7);
            }
        }

        .svetofor-box button {
            margin-top: 10px;
            padding: 10px 22px;
            font-size: 15px;
            background: #4a6cf7;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        .svetofor-box button:hover {
            background: #3b5bdb;
        }

        .status {
            font-size: 14px;
            color: #555;
            min-height: 20px;
        }
    </style>
</head>
<body>

<div id="menu"></div>
<script src="menu.js"></script>

<main>
    <h1>Светофоры</h1>

    <p>Слева — ручное управление кнопкой. Справа — автоматический светофор.</p>
    <p>Последовательность: Красный → Красный + Жёлтый → Зелёный → Мигающий зелёный → Жёлтый → Красный…</p>

    <div class="svetofory">

        <!-- Ручной светофор -->
        <div class="svetofor-box">
            <h3>Ручное управление</h3>

            <div class="traffic-light">
                <div class="light red"    id="m-red"></div>
                <div class="light yellow" id="m-yellow"></div>
                <div class="light green"  id="m-green"></div>
            </div>

            <button onclick="nextManual()">Следующий сигнал</button>
            <div class="status" id="manual-status">Красный</div>
        </div>

        <!-- Автоматический светофор -->
        <div class="svetofor-box">
            <h3>Автоматический</h3>

            <div class="traffic-light">
                <div class="light red"    id="a-red"></div>
                <div class="light yellow" id="a-yellow"></div>
                <div class="light green"  id="a-green"></div>
            </div>

            <div class="status" id="auto-status">Красный</div>
        </div>

    </div>
</main>

<script>
    // Состояния светофора
    const states = [
        { name: 'Красный',          red: true,  yellow: false, green: false, blink: false },
        { name: 'Красный + Жёлтый', red: true,  yellow: true,  green: false, blink: false },
        { name: 'Зелёный',          red: false, yellow: false, green: true,  blink: false },
        { name: 'Мигающий зелёный', red: false, yellow: false, green: true,  blink: true  },
        { name: 'Жёлтый',           red: false, yellow: true,  green: false, blink: false }
    ];

    // ===== Ручной светофор =====
    let manualIndex = 0;

    function setManualState(index) {
        const s = states[index];
        document.getElementById('m-red').classList.toggle('on', s.red);
        document.getElementById('m-yellow').classList.toggle('on', s.yellow);
        const green = document.getElementById('m-green');
        green.classList.toggle('on', s.green);
        green.classList.toggle('blink', s.blink);
        document.getElementById('manual-status').textContent = s.name;
    }

    function nextManual() {
        manualIndex = (manualIndex + 1) % states.length;
        setManualState(manualIndex);
    }

    setManualState(0);

    // ===== Автоматический светофор =====
    let autoIndex = 0;
    const durations = [3000, 1500, 4000, 2000, 1500]; // мс

    function setAutoState(index) {
        const s = states[index];
        document.getElementById('a-red').classList.toggle('on', s.red);
        document.getElementById('a-yellow').classList.toggle('on', s.yellow);
        const green = document.getElementById('a-green');
        green.classList.toggle('on', s.green);
        green.classList.toggle('blink', s.blink);
        document.getElementById('auto-status').textContent = s.name;
    }

    function nextAuto() {
        autoIndex = (autoIndex + 1) % states.length;
        setAutoState(autoIndex);
        setTimeout(nextAuto, durations[autoIndex]);
    }

    setAutoState(0);
    setTimeout(nextAuto, durations[0]);
</script>

</body>
</html>
