<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Задание за 9 ноября</title>
    <link rel="stylesheet" href="style.css">
    <style>
        table { border-collapse: collapse; margin: 20px auto; }
        td { width: 30px; height: 30px; border: 5px solid #fff; }
    </style>
</head>
<body>
<div id="menu"></div>
<script src="menu.js"></script>

<main>
    <h1>Задание за 9 ноября</h1>
</main>

<script>
    let html = '<table>';
    for (let i = 0; i < 11; i++) {
        html += '<tr>';
        for (let j = 0; j < 11; j++) {
            let color = (i + j >= 10) ? '#000080' : '#00d2ff';
            html += `<td style="background:${color}"></td>`;
        }
        html += '</tr>';
    }
    html += '</table>';
    document.write(html);
</script>

</body>
</html>
